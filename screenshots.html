<!-- Load Data JS First, then Page Script -->
    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof systemData !== 'undefined') {
                // ربط بيانات الهوية
                if(document.getElementById('brandLogo')) document.getElementById('brandLogo').src = systemData.brand.logo;
                if(document.getElementById('brandName')) document.getElementById('brandName').innerText = systemData.brand.name;
                if(document.getElementById('footerBrandName')) document.getElementById('footerBrandName').innerText = systemData.brand.name;

                const grid = document.getElementById('screenshotsGrid');
                const searchInput = document.getElementById('searchInput');
                const noResults = document.getElementById('noResults');
                let currentFilter = 'all';

                // دالة عرض الشاشات مع دعم الفلترة والبحث المباشر
                function renderScreenshots(filter = 'all', searchQuery = '') {
                    if(!grid) return;
                    grid.innerHTML = '';
                    
                    let items = systemData.screenshots;

                    // تطبيق فلتر التصنيف
                    if (filter !== 'all') {
                        items = items.filter(item => item.category === filter);
                    }

                    // تطبيق البحث النصي
                    if (searchQuery.trim() !== '') {
                        const query = searchQuery.toLowerCase();
                        items = items.filter(item => 
                            item.title.toLowerCase().includes(query) || 
                            item.description.toLowerCase().includes(query)
                        );
                    }

                    // إظهار تنبيه إذا لم توجد نتائج
                    if (items.length === 0) {
                        if(noResults) noResults.style.display = 'block';
                        return;
                    } else {
                        if(noResults) noResults.style.display = 'none';
                    }

                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = `screenshot-card ${item.category}`;
                        card.innerHTML = `
                            <div class="img-wrapper" onclick="openScreenshotLightbox('${item.fileName}', '${item.title}', '${item.description}')">
                                <img src="${item.fileName}" alt="${item.title}" loading="lazy">
                                <div class="zoom-overlay-icon">
                                    <i class="fas fa-search-plus"></i>
                                </div>
                            </div>
                            <div class="screenshot-info">
                                <span class="tag-category">${item.category.toUpperCase()}</span>
                                <h3>${item.title}</h3>
                                <p>${item.description}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }

                // عرض جميع الشاشات أول مرة
                renderScreenshots('all');

                // أحداث أزرار الفلترة
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentFilter = e.target.getAttribute('data-filter');
                        renderScreenshots(currentFilter, searchInput ? searchInput.value : '');
                    });
                });

                // أحداث شريط البحث الفوري
                if(searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        renderScreenshots(currentFilter, e.target.value);
                    });
                }
            }

            // إدارة نافذة العرض الكبيرة (Lightbox Modal) الشاملة لجميع الـ 34 شاشة
            const modal = document.getElementById('lightboxModal');
            const modalImg = document.getElementById('lightboxImg');
            const modalCaption = document.getElementById('lightboxCaption');
            const closeBtn = document.querySelector('.lightbox-close');

            window.openScreenshotLightbox = function(imgSrc, imgTitle, imgDesc) {
                if(modal && modalImg) {
                    modal.style.display = "flex";
                    modalImg.src = imgSrc;
                    if(modalCaption) {
                        modalCaption.innerHTML = `<strong>${imgTitle}</strong><br><span style="font-size:0.9rem; color:#9ca3af;">${imgDesc}</span>`;
                    }
                    document.body.style.overflow = 'hidden'; // منع سحب الصفحة الخلفية
                }
            };

            function closeLightboxFunc() {
                if(modal) {
                    modal.style.display = "none";
                    document.body.style.overflow = 'auto';
                }
            }

            if(closeBtn) {
                closeBtn.addEventListener('click', closeLightboxFunc);
            }
            
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeLightboxFunc();
                }
            });

            document.addEventListener('keydown', (e) => {
                if(e.key === 'Escape') closeLightboxFunc();
            });

            // قائمة الجوال (Mobile Menu Toggle)
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            if(menuToggle && navLinks) {
                menuToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                });
            }
        });
    </script>
