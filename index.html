<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #059669;
            --accent-hover: #047857;
            --bg-dark: #0b1120;
            --text-main: #334155;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-subtle: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
            --shadow-hover: 0 20px 40px -10px rgba(5, 150, 105, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-main);
            line-height: 1.8;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 24px;
            color: var(--primary);
            text-decoration: none;
        }

        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 10px rgba(5, 150, 105, 0.2);
        }

        .logo-area span {
            color: var(--accent);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .social-icons {
            display: flex;
            gap: 12px;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .social-icon.facebook:hover {
            background: #1877f2;
            color: #fff;
            transform: translateY(-2px);
        }

        .social-icon.youtube:hover {
            background: #ff0000;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
            transition: all 0.3s ease;
        }

        .btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.3);
        }

        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 80px 20px 100px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(5, 150, 105, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .breadcrumb {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .tags {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.1);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 25px;
            color: #ffffff;
            line-height: 1.4;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            max-width: 750px;
            margin: 0 auto 35px auto;
            color: #cbd5e1;
            font-size: 17px;
        }

        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            padding: 14px 35px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.6);
        }

        .scroll-down {
            display: inline-block;
            margin-top: 35px;
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .scroll-down:hover {
            color: #38bdf8;
        }

        .specs-container {
            max-width: 1000px;
            margin: -45px auto 50px auto;
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .spec-item {
            padding: 30px 20px;
            border-left: 1px solid var(--border-color);
        }

        .spec-item:last-child {
            border-left: none;
        }

        .spec-label {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .spec-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        .content-section {
            max-width: 850px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .section-subtitle {
            font-size: 14px;
            color: var(--accent);
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content-section h2 {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 900;
        }

        .content-section p {
            font-size: 17px;
            color: var(--text-light);
            margin-bottom: 15px;
            line-height: 1.9;
        }

        .gallery-container {
            max-width: 1000px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .screenshot-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-subtle);
            margin-bottom: 45px;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .screenshot-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
            border-color: rgba(5, 150, 105, 0.3);
        }

        .mockup-box {
            background: #1e293b;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .mockup-header-dots {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .mockup-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            border: 1px solid #334155;
            margin-bottom: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .mockup-img:last-child {
            margin-bottom: 0;
        }

        .screenshot-info {
            padding: 30px;
            text-align: right;
        }

        .screenshot-info h3 {
            font-size: 22px;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .screenshot-info h3 i {
            color: var(--accent);
            font-size: 24px;
            background: rgba(5, 150, 105, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .screenshot-info p {
            font-size: 16px;
            color: var(--text-light);
            line-height: 1.8;
        }
